function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(t){return t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}
function blk(t){var out='',list=null,m;function close(){if(list){out+='</'+list+'>';list=null}}
t.split('\n').forEach(function(l){
if(list&&/^\s{2,}\S/.test(l)&&!/^\s*([-*]|\d+[.)])\s/.test(l)){out=out.replace(/<\/li>$/,' '+inl(l.trim())+'</li>');return}
if(m=l.match(/^#{1,3}\s+(.*)/)){close();out+='<h4>'+inl(m[1])+'</h4>'}
else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=='ul'){close();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
else if(m=l.match(/^\s*(\d+)[.)]\s+(.*)/)){if(list!=='ol'){close();out+='<ol start="'+m[1]+'">';list='ol'}out+='<li>'+inl(m[2])+'</li>'}
else if(!l.trim()){close()}else{close();out+='<p>'+inl(l)+'</p>'}});

function tex(t,d){try{if(window.katex)return katex.renderToString(t.trim(),{output:'mathml',displayMode:!!d,throwOnError:false,macros:{'\\boxed':'\\mathbf{#1}'}})}catch(e){}return '<code>'+esc(t)+'</code>'}
function mathx(p,mt){var one=function(d){return function(a,t){mt.push([t,d]);return 'MTH'+(mt.length-1)+'X'}};
p=p.replace(/\$\$([\s\S]+?)\$\$/g,one(1)).replace(/\\\[([\s\S]+?)\\\]/g,one(1)).replace(/\\\(([\s\S]+?)\\\)/g,one(0)).replace(/\$([^\s$](?:[^$\n]*[^\s$])?)\$/g,one(0));
return p.replace(/\$\$[\s\S]*$/,'…')}
function md(s){var sv=[];s=s.replace(/```svg\n?([\s\S]*?)```/g,function(a,c){sv.push(c);return '\n\nSVGPH'+(sv.length-1)+'X\n\n'});s=s.replace(/```svg[\s\S]*$/,'\n\nSVGDRAW\n\n');var mt=[];s=s.split('```').map(function(p,i){return i%2?p:mathx(p,mt)}).join('```');s=esc(s);if((s.match(/```/g)||[]).length%2)s+='\n```';

return s.split('\u0001').map(function(p){return p.indexOf('<pre>')===0?p:blk(p)}).join('')
.replace(/<p>SVGPH(\d+)X<\/p>/g,function(a,i){var c=sv[i].trim();if(c.indexOf('<svg')<0)return '<pre><code>'+esc(c)+'</code></pre>';return '<figure class="gen"><img src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(c)+'" alt="Картинка"><button class="cp2" data-svg="'+encodeURIComponent(c)+'">Копировать SVG</button></figure>'})
.replace(/<p>SVGDRAW<\/p>/g,'<div class="drw"><div class="dots"><i></i><i></i><i></i></div>Рисую…</div>').replace(/MTH(\d+)X/g,function(a,i){return mt[i]?'<span class="'+(mt[i][1]?'mth':'mi')+'">'+tex(mt[i][0],mt[i][1])+'</span>':a})}

function space(){var s=$('#scroll'),sp=$('#sp'),p=S.pin;if(!p||!p.parentNode){sp.style.height='24px';return}sp.style.height=Math.max(24,s.clientHeight-($('#col').offsetHeight-p.offsetTop)-10)+'px'}
function ease(to,ms){cancelAnimationFrame(anim);var s=$('#scroll'),f=s.scrollTop,t0=performance.now();(function st(n){var k=Math.min(1,(n-t0)/ms),e=1-Math.pow(1-k,3);s.scrollTop=f+(to-f)*e;if(k<1&&!S.free)anim=requestAnimationFrame(st)})(t0)}

function follow(){if(S.free)return;var s=$('#scroll'),col=$('#col'),bot=col.offsetTop+col.offsetHeight+20,vis=s.scrollTop+s.clientHeight;if(bot>vis)s.scrollTop+=Math.max(.6,(bot-vis)*.14)}
function tick(){space();follow();if(S.busy||performance.now()<S.until)requestAnimationFrame(tick)}

d.appendChild(b);d.appendChild(x);h.appendChild(d)})}

function drawer(o){$('#dr').classList.toggle('on',o);$('#ov').classList.toggle('on',o)}

function shrink(f){return new Promise(function(ok){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.82))};im.onerror=function(){ok(null)};im.src=r.result};r.onerror=function(){ok(null)};r.readAsDataURL(f)})}
function addFiles(fs){Array.prototype.slice.call(fs).filter(function(f){return /^image\//.test(f.type)}).slice(0,4).forEach(function(f){shrink(f).then(function(s){if(s&&S.imgs.length<4){S.imgs.push(s);renderPrev()}})})}
function blob(u){var p=u.split(','),b=atob(p[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/jpeg'})}
function buildInput(msgs){var out=[];msgs.forEach(function(m,i){if(!m.t)return;var t=m.t;if(m.r==='u'&&m.imgs&&m.imgs.length&&i<msgs.length-1)t+='\n[к сообщению было прикреплено фото: '+m.imgs.length+']';var r=m.r==='u'?'user':'assistant';

if(out.length)out[0].content='[Инструкция: '+SYS2+']\n\n'+out[0].content;return out}
async function run(){var c=chat(),am=c.msgs[c.msgs.length-1],last=$('#col').lastChild,ctl=new AbortController();S.ctl=ctl;S.busy=true;upd();var pend=0;function sched(){if(pend)return;pend=1;requestAnimationFrame(function(){pend=0;fill(last,am,true)})}tick();
try{var smp=window.claude&&await window.claude.use('sample');if(!smp)throw{code:'na',message:'ИИ здесь недоступен. Откройте страницу из claude.ai.'};

S.busy=false;S.ctl=null;S.until=performance.now()+700;pend=0;save();upd();if(last.parentNode)fill(last,am,true);renderHist();tick()}

var t=$('#inp').value.trim();if(!t&&!S.imgs.length)return;if(!t)t='Разбери это фото.';vib(12);
